---
custom_component: true
---
<main class="inventory-page">
  <section class="inventory-card">
    <anvil-component type="Label" name="message_label" prop:role="settings-message" prop:visible="false"></anvil-component>

    <div class="inventory-toolbar">
      <div class="inventory-sheet-control">
        <p class="inventory-control-label">Select Tab / Sheet to Load:</p>
        <div class="inventory-sheet-row">
          <anvil-component type="DropDown" name="office_filter" prop:include_placeholder="true" prop:placeholder="-- Select Office --" prop:role="inventory-dropdown"></anvil-component>
          <anvil-component type="DropDown" name="category_filter" prop:include_placeholder="true" prop:placeholder="-- Select Category --" prop:role="inventory-dropdown"></anvil-component>
        </div>
      </div>
      <anvil-component type="TextBox" name="search_box" prop:placeholder="Search records..." prop:role="inventory-search"></anvil-component>
    </div>

    <p class="inventory-filter-help">Enter “empty” or “null” in Search records or the remarks filter to find rows without remarks.</p>
    <div class="inventory-table-viewport">
      <div class="inventory-table">
        <div aria-hidden="true" class="inventory-table-header">
          <span>ROW</span>
          <span>SERIAL</span>
          <span>ITEM</span>
          <span>DESCRIPTION</span>
          <span>OLD PROP #</span>
          <span>NEW PROP #</span>
          <span>SKU</span>
          <span>UNIT VALUE</span>
          <span>Q/CARD</span>
          <span>Q/COUNT</span>
          <span>LOCATION</span>
          <span>ACC PERSON</span>
          <span>REMARKS(Click to Edit)</span>
        </div>

        <div class="inventory-table-filters">
          <span class="inventory-filter-cell"><anvil-component type="TextBox" name="row_filter" prop:placeholder="Filter"></anvil-component></span>
          <span class="inventory-filter-cell"><anvil-component type="TextBox" name="serial_filter" prop:placeholder="Filter serial"></anvil-component></span>
          <span class="inventory-filter-cell"><anvil-component type="TextBox" name="item_filter" prop:placeholder="Filter item"></anvil-component></span>
          <span class="inventory-filter-cell"><anvil-component type="TextBox" name="description_filter" prop:placeholder="Filter description"></anvil-component></span>
          <span class="inventory-filter-cell"><anvil-component type="TextBox" name="old_property_filter" prop:placeholder="Filter old prop #"></anvil-component></span>
          <span class="inventory-filter-cell"><anvil-component type="TextBox" name="new_property_filter" prop:placeholder="Filter new prop #"></anvil-component></span>
          <span class="inventory-filter-cell"><anvil-component type="TextBox" name="sku_filter" prop:placeholder="Filter SKU"></anvil-component></span>
          <span class="inventory-filter-cell"><anvil-component type="TextBox" name="unit_value_filter" prop:placeholder="Filter value"></anvil-component></span>
          <span class="inventory-filter-cell"><anvil-component type="TextBox" name="quantity_card_filter" prop:placeholder="Filter Q/Card"></anvil-component></span>
          <span class="inventory-filter-cell"><anvil-component type="TextBox" name="quantity_count_filter" prop:placeholder="Filter Q/Count"></anvil-component></span>
          <span class="inventory-filter-cell"><anvil-component type="TextBox" name="location_filter" prop:placeholder="Filter location"></anvil-component></span>
          <span class="inventory-filter-cell"><anvil-component type="TextBox" name="assignee_filter" prop:placeholder="Filter person"></anvil-component></span>
          <span class="inventory-filter-cell"><anvil-component type="TextBox" name="remarks_filter" prop:placeholder="Filter remarks"></anvil-component></span>
        </div>

        <anvil-component type="Label" name="empty_label" prop:text="Please select an office and category above to load inventory items..." prop:role="inventory-empty-state"></anvil-component>
        <anvil-component type="RepeatingPanel" name="equipment_panel" prop:item_template="Transaction_Tracker_System.InventoryRow" prop:role="inventory-records"></anvil-component>
      </div>
    </div>

    <anvil-component type="ColumnPanel" name="add_equipment_panel" prop:role="card" prop:visible="false">
      <anvil-component type="Label" name="add_heading" prop:text="Add equipment" prop:role="section-title"></anvil-component>
      <anvil-component type="Label" name="add_message" prop:role="error-text" prop:visible="false"></anvil-component>
      <anvil-component type="DropDown" name="office_box" prop:include_placeholder="true" prop:placeholder="Office *"></anvil-component>
      <anvil-component type="DropDown" name="category_box" prop:include_placeholder="true" prop:placeholder="Category *"></anvil-component>
      <anvil-component type="TextBox" name="article_item_box" prop:placeholder="Article item *"></anvil-component>
      <anvil-component type="TextBox" name="description_box" prop:placeholder="Description *"></anvil-component>
      <anvil-component type="TextBox" name="serial_box" prop:placeholder="Serial number"></anvil-component>
      <anvil-component type="TextBox" name="old_property_box" prop:placeholder="Old property number"></anvil-component>
      <anvil-component type="TextBox" name="new_property_box" prop:placeholder="New property number"></anvil-component>
      <anvil-component type="TextBox" name="sku_box" prop:placeholder="SKU"></anvil-component>
      <anvil-component type="TextBox" name="unit_value_box" prop:placeholder="Unit value"></anvil-component>
      <anvil-component type="TextBox" name="quantity_card_box" prop:placeholder="Q/card"></anvil-component>
      <anvil-component type="TextBox" name="quantity_count_box" prop:placeholder="Q/count"></anvil-component>
      <anvil-component type="TextBox" name="manufacturer_box" prop:placeholder="Manufacturer"></anvil-component>
      <anvil-component type="TextBox" name="model_box" prop:placeholder="Model"></anvil-component>
      <anvil-component type="TextBox" name="location_box" prop:placeholder="Location"></anvil-component>
      <anvil-component type="DropDown" name="new_status_box" prop:include_placeholder="true" prop:placeholder="Initial status"></anvil-component>
      <anvil-component type="TextArea" name="new_notes_box" prop:placeholder="Remarks"></anvil-component>
      <anvil-component type="Button" name="add_button" prop:text="Add equipment" prop:role="primary-button"></anvil-component>
    </anvil-component>

    <anvil-component type="ColumnPanel" name="action_panel" prop:role="card" prop:visible="false">
      <anvil-component type="Label" name="action_heading" prop:role="section-title"></anvil-component>
      <anvil-component type="Label" name="action_message" prop:role="error-text"></anvil-component>
      <anvil-component type="ColumnPanel" name="transfer_fields" prop:visible="false">
        <anvil-component type="DropDown" name="transfer_user_box" prop:include_placeholder="true" prop:placeholder="Assign to employee"></anvil-component>
      </anvil-component>
      <anvil-component type="ColumnPanel" name="status_fields" prop:visible="false">
        <anvil-component type="DropDown" name="status_box" prop:include_placeholder="true" prop:placeholder="Inventory status"></anvil-component>
      </anvil-component>
      <anvil-component type="TextArea" name="action_notes_box" prop:placeholder="Reason or notes"></anvil-component>
      <anvil-component type="FlowPanel" name="action_buttons" prop:role="form-actions">
        <anvil-component type="Button" name="action_cancel_button" prop:text="Cancel" prop:role="secondary-button"></anvil-component>
        <anvil-component type="Button" name="action_save_button" prop:text="Save change" prop:role="primary-button"></anvil-component>
      </anvil-component>
    </anvil-component>

    <anvil-component type="Label" name="audit_heading" prop:text="Inventory audit trail" prop:role="section-title"></anvil-component>
    <anvil-component type="RepeatingPanel" name="audit_panel" prop:item_template="Transaction_Tracker_System.InventoryAuditRow" prop:role="audit-list"></anvil-component>
  </section>
</main>
